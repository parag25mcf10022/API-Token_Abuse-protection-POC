<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AAP — Admin panel</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="wrap wide">
    <header>
      <h1>🛠️ Admin panel</h1>
      <p class="sub">Toggle any user's API key on or off.</p>
    </header>

    <section class="card">
      <div class="row between">
        <a href="/" class="ghost small">← Back to dashboard</a>
        <button id="refresh" class="ghost small">Refresh</button>
      </div>
      <p id="admin-error" class="error"></p>
      <table>
        <thead>
          <tr>
            <th>Email</th>
            <th>Session</th>
            <th>Key</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="users"></tbody>
      </table>
    </section>
  </div>

  <script src="/admin.js"></script>
</body>
</html>
